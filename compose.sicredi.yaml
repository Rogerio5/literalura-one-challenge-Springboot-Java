services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: literalura
      POSTGRES_USER: literalura
      POSTGRES_PASSWORD: ${LITERALURA_DB_PASSWORD}
    volumes:
      - literalura_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U literalura -d literalura"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: Dockerfile.sicredi
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/literalura
      SPRING_DATASOURCE_USERNAME: literalura
      SPRING_DATASOURCE_PASSWORD: ${LITERALURA_DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

volumes:
  literalura_pgdata:
